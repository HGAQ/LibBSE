name: LibBSE regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMPI_MCA_rmaps_base_oversubscribe: '1'
      OMPI_MCA_hwloc_base_binding_policy: none
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned LibRPA
        run: |
          git init ci-deps/LibRPA
          git -C ci-deps/LibRPA remote add origin https://github.com/HGAQ/LibRPA_LibBSE.git
          git -C ci-deps/LibRPA fetch --depth 1 origin 7551e28df26175167eb2415e5dbbaf5bec7d1ce6
          git -C ci-deps/LibRPA checkout --detach FETCH_HEAD
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv g++ gfortran cmake make pkg-config libtool \
            libopenmpi-dev openmpi-bin libopenblas-dev libscalapack-openmpi-dev
          python3 -m venv "$RUNNER_TEMP/libbse-python"
          "$RUNNER_TEMP/libbse-python/bin/python" -m pip install -r regression_test/backend/requirements.txt
          echo "$RUNNER_TEMP/libbse-python/bin" >> "$GITHUB_PATH"
      - name: Build ELPA with skew support
        run: bash regression_test/backend/build_ci_elpa.sh
      - name: compile LibBSE
        id: compile
        run: |
          set -euo pipefail
          mkdir -p build-ci
          cmake -S . -B build-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$(command -v python3)" \
            -DCMAKE_CXX_COMPILER=mpicxx -DCMAKE_Fortran_COMPILER=mpifort \
            -DBLA_VENDOR=OpenBLAS -DLIBRPA_USE_CMAKE_INC=OFF \
            -DLIBBSE_BUILD_TESTING=ON \
            -DLIBRPA_INCLUDE_DIR="$PWD/ci-deps/LibRPA/include" \
            -DCEREAL_INCLUDE_DIR="$PWD/thirdparty/cereal-1.3.0/include" \
            -DLIBCOMM_INCLUDE_DIR="$PWD/thirdparty/LibComm/include" \
            -DLIBRI_INCLUDE_DIR="$PWD/thirdparty/LibRI/include" \
            -DEXTERNAL_ELPA_DIR="$PWD/ci-deps/elpa-install" \
            -DLIBBSE_REGRESSION_FIXTURES= \
            -DLIBBSE_REGRESSION_REFERENCE_EXE= 2>&1 | tee build-ci/configure.log
          cmake --build build-ci --parallel 2 2>&1 | tee build-ci/build.log
      - name: Test General cases
        id: general
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -euo pipefail
          ctest --test-dir build-ci -LE "integration|real_si" --parallel 1 --no-tests=error \
            --output-on-failure --output-junit regression.xml 2>&1 | tee build-ci/ctest.log
      - name: test physical cases
        id: physical
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -euo pipefail
          ctest --test-dir build-ci -L real_si --parallel 1 --no-tests=error \
            --output-on-failure --output-junit real-si.xml 2>&1 | tee build-ci/real-si.log
      - name: postrun
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build-ci/*.log
            build-ci/*.xml
            build-ci/CMakeCache.txt
            build-ci/Testing/Temporary/LastTest.log
            ci-deps/elpa-build/config.log
            build-ci/real_si_runs/*/comparison.txt
            build-ci/real_si_runs/*/candidate/libbse.out
            build-ci/real_si_runs/*/candidate/libbse.err
      - name: report
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          GENERAL_OUTCOME: ${{ steps.general.outcome }}
          PHYSICAL_OUTCOME: ${{ steps.physical.outcome }}
        run: python3 regression_test/backend/ci_report.py --build build-ci
